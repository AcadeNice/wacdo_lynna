<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wacdo - Saisie du numéro de chevalet">
  <meta name="author" content="Wacdo">
  <title>Wacdo - Numéro de chevalet</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/chevalet.css">
</head>
<body>

<main class="wrapper" role="main">

  <div class="white-box">

    <!-- Logo -->
    <img src="../img/images/logo.png" alt="Wacdo" class="logo">

    <!-- Titre -->
    <h1 class="title">Merci de placer votre<br>chevalet sur la table</h1>

    <!-- Sous-texte -->
    <p class="subtitle">
      Pour être servis à table,<br>
      récupérez un chevalet et indiquez ici le numéro inscrit dessus
    </p>

    <!-- Champ de saisie -->
    <div class="input-container">
      <input 
        type="number" 
        id="chevalet-number" 
        placeholder="Saisissez votre numéro"
        min="1"
        max="999"
        aria-label="Numéro de chevalet"
      >
    </div>

    <!-- Bouton valider -->
    <button id="submit-chevalet" class="submit-btn" disabled>
      Enregistrer le numéro
    </button>

  </div>

</main>

<script src="../js/chevalet.js?v=20260420-2"></script>
</body>
</html>
