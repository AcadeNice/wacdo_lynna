<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wacdo - Choix du mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/mode-selection.css?v=3">
</head>

<body>

<main class="wrapper">

    <!-- Bloc blanc -->
    <div class="white-box">

        <img src="../img/images/logo.png" alt="Wacdo" class="landing-logo">

        <h2 class="bonjour">Bonjour,</h2>

        <h1 class="question">
            Souhaitez-vous consommer votre menu sur place<br>
            ou préférez-vous l’emporter ?
        </h1>

        <div class="choices">

            <!-- Sur place -->
            <button class="choice-btn" id="sur-place">
                <img src="../img/images/illustration-sur-place.png" alt="Sur place">
                <span>Sur place</span>
            </button>

            <!-- À emporter -->
            <button class="choice-btn" id="emporter">
                <img src="../img/images/illustration-a-emporter.png" alt="À emporter">
                <span>À emporter</span>
            </button>

        </div>

    </div>

</main>

<script src="../js/mode-selection.js"></script>
</body>
</html>
